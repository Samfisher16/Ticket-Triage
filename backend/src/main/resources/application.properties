server.port=8080

# File-based H2 database: tickets survive restarts. Stored in ./data/
spring.datasource.url=jdbc:h2:file:./data/tickets
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Gemini (free tier). Get a key at https://aistudio.google.com/apikey
# Set it as an environment variable: GEMINI_API_KEY
gemini.api-key=${GEMINI_API_KEY:}
# Model is configurable in case Google changes which models are on the free tier
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
